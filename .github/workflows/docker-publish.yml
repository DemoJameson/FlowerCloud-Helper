name: Build and Publish Docker image

# 推送到 main 或打 tag（v1.2.3）时，构建镜像并发布到 GHCR
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支连续推送时只保留最新一次：过期的构建既费时间，
# 推上去的 sha 标签也没人拉，白占 GHCR 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository 会自动带上所有者并做小写归一化
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑 lint + 单元测试，不通过就不发布镜像
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & test
        run: npm test

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # arm64 靠 QEMU 模拟。这里真正需要模拟的只剩「装 ca-certificates」一步
      # （node:22-slim 不自带，装的是架构相关的包，没法跨架构复用）；
      # npm ci 已在 Dockerfile 里挪到 $BUILDPLATFORM 原生执行。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支的每次 commit → latest；版本 tag 构建不覆盖 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 → 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 每次构建的 commit 短哈希，便于回滚定位
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
